# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Spring Application Name
spring.application.name=plant-care-ai-backend

# MySQL Configuration (Default connection string)
spring.datasource.url=jdbc:mysql://localhost:3306/plant_care_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Fallback Database (If MySQL connection fails during dev)
# spring.datasource.url=jdbc:h2:mem:plantcaredb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# DJL AI Model Settings
djl.image.size=224
djl.confidence.threshold=0.35
